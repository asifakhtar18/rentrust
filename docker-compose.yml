# Optional local PostgreSQL/PostGIS and Redis for NestJS development.
# Vercel production uses managed Supabase Postgres and Upstash Redis.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rentrust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentrust
      POSTGRES_PASSWORD: rentrust
      POSTGRES_DB: rentrust
    ports:
      - '5432:5432'
    volumes:
      - rentrust-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rentrust -d rentrust']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    profiles: ['legacy']
    image: redis:7-alpine
    container_name: rentrust-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - rentrust-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Local API and BullMQ worker are opt-in; Vercel functions recalculate scores
  # inline and do not start a persistent queue consumer.
  api:
    profiles: ['legacy']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rentrust-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: '4000'
      DATABASE_URL: postgresql://rentrust:rentrust@postgres:5432/rentrust?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-mock}
    ports:
      - '4000:4000'

  worker:
    profiles: ['legacy']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rentrust-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://rentrust:rentrust@postgres:5432/rentrust?schema=public
      REDIS_URL: redis://redis:6379
    command: ['node', 'dist/worker.js']

volumes:
  rentrust-postgres-data:
  rentrust-redis-data:
