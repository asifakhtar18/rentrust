# Local development infrastructure for RentTrust.
# Brings up PostgreSQL (with PostGIS), Redis, and MinIO (S3-compatible object
# storage). The API and worker run on the host during development; see the
# production Dockerfile / container-host config added in Phase 14 for deploys.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: rentrust-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rentrust
      POSTGRES_PASSWORD: rentrust
      POSTGRES_DB: rentrust
    ports:
      - '5432:5432'
    volumes:
      - rentrust-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rentrust -d rentrust']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rentrust-redis
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - rentrust-redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: rentrust-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: rentrust
      MINIO_ROOT_PASSWORD: rentrust-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - rentrust-minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # API and worker are opt-in via the "app" profile so local dev can run them
  # on the host while only infra runs in Docker:
  #   docker compose up -d                 # infra only
  #   docker compose --profile app up -d   # infra + API + worker
  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rentrust-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: '4000'
      DATABASE_URL: postgresql://rentrust:rentrust@postgres:5432/rentrust?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-mock}
    ports:
      - '4000:4000'

  worker:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: rentrust-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://rentrust:rentrust@postgres:5432/rentrust?schema=public
      REDIS_URL: redis://redis:6379
    command: ['node', 'dist/worker.js']

volumes:
  rentrust-postgres-data:
  rentrust-redis-data:
  rentrust-minio-data:
